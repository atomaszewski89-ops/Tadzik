<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle rounded background for iOS & Android -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Background decorative compass ring -->
  <circle cx="256" cy="235" r="145" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,8" opacity="0.3" />
  
  <!-- Outer Star markers -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="256" cy="78" r="4" />
    <circle cx="256" cy="392" r="4" />
    <circle cx="98" cy="235" r="4" />
    <circle cx="414" cy="235" r="4" />
  </g>

  <!-- Central Emblem: Vintage Steam Locomotive & Compass Needle -->
  <g filter="url(#shadow)">
    <!-- Locomotive Body -->
    <path d="M160 300 H352 V310 C352 315 348 320 342 320 H170 C164 320 160 315 160 310 Z" fill="url(#goldGrad)" />
    
    <!-- Cabin -->
    <path d="M170 190 H240 V300 H170 C164 300 160 296 160 290 V200 C160 194 164 190 170 190 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="6" />
    <rect x="180" y="208" width="42" height="38" rx="6" fill="#38bdf8" opacity="0.9" stroke="#0f172a" stroke-width="3" />

    <!-- Boiler Cylinder -->
    <path d="M240 215 H330 C345 215 355 227 355 242 V300 H240 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="6" />
    
    <!-- Front Boiler Cap (Round) -->
    <path d="M330 215 C348 215 358 230 358 257.5 C358 285 348 300 330 300" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Steam Chimney -->
    <path d="M312 215 L306 165 H334 L328 215 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    
    <!-- Steam Dome -->
    <path d="M260 215 C260 200 280 200 280 215 Z" fill="url(#goldGrad)" />

    <!-- Cowcatcher / Front Grill -->
    <path d="M352 300 L380 325 H345 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />

    <!-- Steam Clouds -->
    <g fill="#e0e7ff" opacity="0.85">
      <circle cx="340" cy="140" r="14" />
      <circle cx="365" cy="120" r="20" />
      <circle cx="400" cy="100" r="26" />
      <circle cx="438" cy="85" r="18" />
    </g>

    <!-- Wheels -->
    <!-- Big Driving Wheel 1 -->
    <circle cx="210" cy="318" r="28" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="210" cy="318" r="8" fill="url(#goldGrad)" />
    
    <!-- Big Driving Wheel 2 -->
    <circle cx="270" cy="318" r="28" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="270" cy="318" r="8" fill="url(#goldGrad)" />

    <!-- Front Small Wheel -->
    <circle cx="335" cy="328" r="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5" />
    <circle cx="335" cy="328" r="5" fill="url(#goldGrad)" />

    <!-- Connecting Rod -->
    <rect x="205" y="315" width="70" height="6" rx="3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />

    <!-- Headlight beam -->
    <polygon points="358,235 480,210 480,270" fill="#fef08a" opacity="0.25" />
    <circle cx="358" cy="240" r="7" fill="#fef08a" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" text-anchor="middle" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="6">TADZIK</text>
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">ASYSTENT SENIORA</text>
</svg>
